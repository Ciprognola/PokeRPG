name: Deploy Slicer

# Publishes the Slicer PWA to GitHub Pages at /<repo>/slicer/.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w @pokerpg/slicer
        env:
          BASE_PATH: /${{ github.event.repository.name }}/slicer/
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r packages/slicer/dist site/slicer
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=slicer/"><a href="slicer/">Slicer</a>' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
