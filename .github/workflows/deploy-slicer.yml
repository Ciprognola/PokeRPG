name: Deploy Slicer

# Publishes the Slicer PWA to GitHub Pages at /<repo>/slicer/.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w @pokerpg/slicer
        env:
          BASE_PATH: /${{ github.event.repository.name }}/slicer/
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r packages/slicer/dist site/slicer
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=slicer/"><a href="slicer/">Slicer</a>' > site/index.html
      - name: Build PKR-015 Phaser spikes (throwaway, removed after the engine decision)
        # Additive: only adds site/spikes/; site/slicer above is untouched. continue-on-error so a
        # broken spike can never block the Slicer deploy. Runs BEFORE the overrides guard below,
        # so the guard also scans the spikes' output.
        continue-on-error: true
        run: |
          node spikes/scripts/prepare.mjs
          for v in 3 4; do
            SPIKE_PHASER=$v BASE_PATH=/${{ github.event.repository.name }}/spikes/ npx vite build --config spikes/vite.config.ts
          done
          mkdir -p site/spikes
          cp -r spikes/dist/phaser3 spikes/dist/phaser4 site/spikes/
      - name: Verify the deployed site carries no overrides/ content
        # overrides/ is git-ignored (PKR-014) so a clean checkout never has one; this also
        # catches a future build step that reads from it by name and leaks the result in.
        run: |
          if find site -iname '*overrides*' | grep -q .; then
            echo "::error::overrides/ content found in the deployed site:"
            find site -iname '*overrides*'
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
